# Reset without requiring hart examination. Useful when a normal OpenOCD
# connection cannot halt the core. This file does not configure flash banks.
source [file join [file dirname [info script]] ft2232.cfg]
jtag newtap hpm5361 cpu -irlen 5 -expected-id 0x1000563d
gdb port disabled
telnet port disabled
tcl port disabled

proc hpm5300evk_reset {} {
	adapter assert srst
	sleep 100
	adapter deassert srst
	sleep 500
	jtag arp_init
}
