source [find probes/ft2232.cfg]
transport select jtag
ftdi channel 0

# HPM5300EVK RevC schematic, sheet 8 (also tested on RevD):
# ACBUS0 is TRST (R123),
# ACBUS1 is RESETN (R124), and ACBUS2/3 are not connected.
# Keep TRST high; emulate open-drain RESETN with the FTDI direction bit.
ftdi layout_init 0x0308 0x010b
ftdi layout_signal nTRST -data 0x0100 -oe 0x0100
ftdi layout_signal nSRST -data 0x0200 -oe 0x0200
reset_config trst_and_srst separate srst_gates_jtag trst_push_pull srst_open_drain
adapter srst pulse_width 100
adapter srst delay 500

bindto 127.0.0.1
