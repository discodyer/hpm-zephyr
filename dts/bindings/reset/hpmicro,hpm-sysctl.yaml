description: |
  HPMicro SYSCTL reset controller.

  SYSCTL exposes two reset domains, SoC and CPU0. Asserting either domain
  resets the running system. The reset IDs are defined in
  dt-bindings/reset/hpmicro-hpm5300-reset.h.

compatible: "hpmicro,hpm-sysctl"

include: [base.yaml, reset-controller.yaml]

properties:
  reg:
    required: true

  "#reset-cells":
    const: 1

reset-cells:
  - id
