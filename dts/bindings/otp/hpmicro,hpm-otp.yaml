description: |
  HPMicro one-time programmable fuse controller.

  The controller exposes 128 32-bit shadow words (512 bytes). Reads use the
  shadow array loaded at reset. Irreversible programming is only available
  when CONFIG_OTP_PROGRAM is enabled.

compatible: "hpmicro,hpm-otp"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true
