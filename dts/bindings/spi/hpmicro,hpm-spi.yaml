description: HPMicro SPI controller

compatible: "hpmicro,hpm-spi"

include: [spi-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  clock-name:
    type: int
    required: true
    description: HPM SDK clock resource identifier

  clock-src:
    type: int
    required: true
    description: SPI clock source selector
