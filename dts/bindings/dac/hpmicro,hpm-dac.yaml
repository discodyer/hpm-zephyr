description: HPMicro DAC controller

compatible: "hpmicro,hpm-dac"

include: [dac-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  clock-name:
    type: int
    required: true

  clock-src:
    type: int
    required: true

  ana-clock-name:
    type: int
    required: true

  ana-clock-src:
    type: int
    required: true

io-channel-cells:
  - output
