description: HPMicro DAC controller

compatible: "hpmicro,hpm-dac"

include: [dac-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  "#io-channel-cells":
    const: 1
