description: HPMicro USB controller

compatible: "hpmicro,hpm-usb"

include: [usb-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  clock-name:
    type: int
    required: true
    description: HPM SDK clock resource identifier

  num-bidir-endpoints:
    type: int
    required: true
    description: Number of bidirectional USB endpoints.

  hpmicro,power-control-active-high:
    type: boolean
    description: |
      Select active-high polarity for the USB0 power-control output. The
      HPM5300EVK uses an active-high USB0_PWR signal.
