description: HPMicro USB controller

compatible: "hpmicro,hpm-usb"

include: [usb-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  clock-name:
    type: int
    required: true
    description: HPM SDK clock resource identifier

  num-bidir-endpoints:
    type: int
    required: true
    description: Number of bidirectional USB endpoints.
