description: HPMicro PLL version 2 controller

compatible: "hpmicro,hpm-pllv2"

include: [clock-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  clock-frequency:
    type: int
    description: Nominal PLL reference frequency in Hz.

  "#clock-cells":
    const: 3

clock-cells:
  - name
  - source
  - divider
