description: |
  HPMicro PTPC timestamp controller. The controller owns the shared register
  block and clock; each child is an independent timestamp counter.

compatible: "hpmicro,hpm-ptpc-controller"

include: base.yaml

properties:
  reg:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0
