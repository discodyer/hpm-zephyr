description: |
  HPMicro programmable logic block.

  PLB contains four TYPE_A combinational/sequential channels and four TYPE_B
  counting/filtering channels, all connected through the trigger manager.

compatible: "hpmicro,hpm-plb"

include: base.yaml

properties:
  reg:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  trgm:
    type: phandle
    required: true
    description: TRGM controller used by the PLB filter and encoder components.
