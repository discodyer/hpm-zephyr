description: |
  HPMicro serial encoder interface.

  The controller exposes two protocol-neutral SEI channels. Software supplies
  the transceiver mode, instruction program and SAMPLE/UPDATE mapping for the
  selected encoder protocol.

compatible: "hpmicro,hpm-sei"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  interrupt-names:
    required: true
    min-len: 2
    max-len: 2
    enum:
      - "channel0"
      - "channel1"
    description: |
      SEI channel interrupt names. The two entries must be "channel0" and
      "channel1" in the same order as the interrupts property.

  clocks:
    required: true

  clock-names:
    required: true

  synt:
    type: phandle
    description: |
      Synchronization timer that provides the shared motor timestamp. SEI
      captures this timestamp in LATCH0/LATCH1 for SAMPLE/UPDATE.
