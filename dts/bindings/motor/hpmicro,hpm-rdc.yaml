description: |
  HPMicro resolver-to-digital converter.

  The controller generates a resolver excitation signal and accumulates
  rectified I/Q ADC samples for position processing.

compatible: "hpmicro,hpm-rdc"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true
