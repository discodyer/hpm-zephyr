description: |
  HPMicro QEIV2 quadrature encoder interface.

  The driver covers square-wave ABZ quadrature, pulse/direction, up/down and
  UVW decoding. The phase counter wraps at counts-per-revolution and the
  controller's angle output is exposed through the generic sensor rotation
  channel. Sine/cosine ADC modes are not supported.

compatible: "hpmicro,hpm-qeiv2"

include: [sensor-device.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  clock-name:
    type: int
    required: true

  clock-src:
    type: int
    required: true

  mode:
    type: string
    default: "abz"
    enum:
      - "abz"
      - "pulse-direction"
      - "up-down"
      - "uvw"
    description: |
      Square-wave input decoding mode. UVW uses A/U, B/V and Z/W and installs
      the six default UVW position codes from the vendor driver.

  counts-per-revolution:
    type: int
    min: 2
    required: true
    description: Number of quadrature counts in one mechanical revolution.

  z-calibration:
    type: boolean
    description: |
      Calibrate the phase counter from the Z/index input. When disabled, the
      Z input is neither required nor used for phase calibration.

  phase-index:
    type: int
    min: 0
    default: 0
    description: |
      Phase counter value loaded when z-calibration detects the Z input.

  filter-length:
    type: int
    default: 0
    min: 0
    max: 511
    description: |
      Digital delay-filter length applied to the A and B inputs. Zero disables
      the filter.
