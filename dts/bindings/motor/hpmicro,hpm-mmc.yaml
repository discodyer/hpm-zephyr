description: |
  HPMicro motion processing unit.

  The controller combines position tracking and two predictors. Software
  supplies position, velocity, acceleration, coefficient and trigger
  parameters at runtime.

compatible: "hpmicro,hpm-mmc"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true
