description: HPMicro ADC16 controller

compatible: "hpmicro,hpm-adc16"

include: [adc-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  "#io-channel-cells":
    const: 1
