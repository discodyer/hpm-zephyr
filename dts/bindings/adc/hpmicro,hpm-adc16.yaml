description: HPMicro ADC16 controller

compatible: "hpmicro,hpm-adc16"

include: [adc-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  clock-name:
    type: int
    required: true

  clock-src:
    type: int
    required: true

  ana-clock-name:
    type: int
    required: true

  ana-clock-src:
    type: int
    required: true

  vref-mv:
    type: int
    description: ADC reference voltage in millivolts

io-channel-cells:
  - input
