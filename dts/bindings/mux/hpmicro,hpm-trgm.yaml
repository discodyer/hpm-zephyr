description: |
  HPMicro Trigger Manager (TRGM).

  Each TRGM output is addressed as a mux control line. The mux state is the
  TRGM input source number, using the HPM_TRGM0_INPUT_SRC_* constants from the
  pinned HPM SDK. The HPM-specific API extension configures input filters,
  output edge conversion and polarity, DMA requests, and the ADC/DAC/position
  routing matrices.

compatible: "hpmicro,hpm-trgm"

include: [base.yaml, mux-controller.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  "#mux-control-cells":
    const: 1

  "#mux-state-cells":
    const: 2

mux-control-cells:
  - output

mux-state-cells:
  - output
  - source
