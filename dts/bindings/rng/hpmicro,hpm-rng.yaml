description: HPMicro random number generator

compatible: "hpmicro,hpm-rng"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  self-test:
    type: boolean
    description: Run the RNG self-test during device initialization.
