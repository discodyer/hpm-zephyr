description: |
  HPMicro inter-core message mailbox endpoint.

  MBX0A and MBX0B are the two register interfaces of one hardware mailbox.
  Data written to one endpoint is received by the other. Each endpoint has a
  single 32-bit word-message register plus a separate four-word FIFO. The
  Zephyr mailbox binding exposes the word-message path as one channel so that
  message boundaries and callback payload sizes remain well defined.

compatible: "hpmicro,hpm-mbx"

include: [base.yaml, mailbox-controller.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

mbox-cells:
  - channel
