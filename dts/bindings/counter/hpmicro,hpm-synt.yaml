description: |
  HPMicro synchronization timer.

  SYNT provides a synchronization counter with four comparator outputs and a
  separate free-running timestamp used by the motion-control subsystem.

compatible: "hpmicro,hpm-synt"

include: base.yaml

properties:
  reg:
    required: true

  clocks:
    required: true

  clock-names:
    required: true
