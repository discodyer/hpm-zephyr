description: HPMicro CRC accelerator

compatible: "hpmicro,hpm-crc"

include: base.yaml

properties:
  reg:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  channel:
    type: int
    enum: [0, 1, 2, 3, 4, 5, 6, 7]
    default: 0
    description: Hardware CRC channel used by the Zephyr CRC device.
