description: HPMicro XPI NOR flash

compatible: "hpmicro,hpmicro-flash"

include: [soc-nv-flash.yaml]

on-bus: xpi

properties:
  nor-cfg-opt-hdr:
    type: int
    required: true

  nor-cfg-opt-opt0:
    type: int
    required: true

  nor-cfg-opt-opt1:
    type: int
    required: true
