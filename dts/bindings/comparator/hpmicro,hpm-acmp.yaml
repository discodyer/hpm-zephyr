description: |
  HPMicro analog comparator controller.

  The controller owns the shared register block and clock. Each comparator
  channel is represented by a child node compatible with
  "hpmicro,hpm-acmp-comp".

compatible: "hpmicro,hpm-acmp"

include: base.yaml

properties:
  reg:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0
