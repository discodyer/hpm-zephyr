description: |
  HPMicro analog comparator channel.

  Values for the input properties are defined in
  <dt-bindings/comparator/hpmicro-acmp.h>. Selecting HPM_ACMP_INPUT_DAC_OUT
  enables the channel's internal 8-bit DAC threshold.

compatible: "hpmicro,hpm-acmp-comp"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true
    description: Comparator channel index (0 or 1).

  interrupts:
    required: true

  positive-input:
    type: int
    enum: [0, 1, 2, 3, 4, 5, 6, 7]
    default: 0
    description: Non-inverting input selection.

  negative-input:
    type: int
    enum: [0, 1, 2, 3, 4, 5, 6, 7]
    default: 0
    description: Inverting input selection.

  hysteresis:
    type: int
    enum: [0, 1, 2, 3]
    default: 0
    description: |
      Hysteresis level: 0 is approximately 30 mV, 1 is 20 mV, 2 is 10 mV
      and 3 disables hysteresis.

  filter-mode:
    type: string
    enum: ["bypass", "immediate", "delay", "stable-low", "stable-high"]
    default: "bypass"
    description: Digital output filter mode.

  filter-length:
    type: int
    default: 0
    description: Digital filter length in ACMP clock cycles.

  invert-output:
    type: boolean
    description: Invert the comparator output polarity.

  enable-output-pin:
    type: boolean
    description: Enable the comparator output on its digital output pin.

  high-performance-mode:
    type: boolean
    description: Trade increased power consumption for lower output delay.

  dac-value:
    type: int
    default: 0
    description: Internal DAC threshold value, from 0 to 255.
