tests:
  boards.hpmicro.hpm5300evk.smoke:
    tags:
      - hpmicro
      - smoke
    platform_allow:
      - hpm5300evk/hpm5361
      - hpm5361icb/hpm5361
    build_only: true
    integration_platforms:
      - hpm5300evk
      - hpm5361icb

  boards.hpmicro.hpm5361icb.all_hal:
    tags:
      - hpmicro
      - smoke
      - hal
    platform_allow:
      - hpm5361icb/hpm5361
    build_only: true
    integration_platforms:
      - hpm5361icb
    extra_args: CONFIG_HPM_SDK_BUILD_ALL_DRIVERS=y

  boards.hpmicro.hpm5300evk.peripherals:
    tags:
      - hpmicro
      - drivers
    platform_allow:
      - hpm5300evk/hpm5361
    build_only: true
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=peripherals.overlay
      - EXTRA_CONF_FILE=peripherals.conf

  boards.hpmicro.hpm5300evk.sei_without_synt:
    tags:
      - hpmicro
      - drivers
    platform_allow:
      - hpm5300evk/hpm5361
    build_only: true
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=sei_no_synt.overlay
      - EXTRA_CONF_FILE=sei_no_synt.conf
