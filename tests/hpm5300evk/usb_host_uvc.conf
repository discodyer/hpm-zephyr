# Exercise the UHC driver through Zephyr's host core, hub class and UVC class.
# UVC uses isochronous transfers, so this configuration also builds the iTD and
# split-siTD paths. No USB traffic is generated by this build-only scenario.
CONFIG_VIDEO=y
CONFIG_POLL=y
CONFIG_USB_HOST_STACK=y
CONFIG_HPMICRO_USB_ROLE_HOST=y
CONFIG_UHC_HPMICRO=y
CONFIG_USBH_HUB_CLASS=y
CONFIG_USBH_VIDEO_CLASS=y
CONFIG_UHC_XFER_COUNT=32
CONFIG_UHC_BUF_COUNT=32
CONFIG_UHC_BUF_POOL_SIZE=8192
CONFIG_USBH_VIDEO_CONCURRENT_TRANSFERS=2
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=32768
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=1
CONFIG_VIDEO_BUFFER_POOL_ALIGN=32
CONFIG_XIP=y
CONFIG_USE_DT_CODE_PARTITION=y
